<style>
  :root{
    --ivory:#EFE8D7;--warm-white:#FBF7EF;--moss:#4A6741;--moss-light:#6B8A61;
    --moss-pale:#EBF0E8;--gold:#D4A629;--brown:#8A6F55;
    --text-dark:#2C2C2C;--text-mid:#5A5A5A;--text-light:#9A9A9A;--line:#E0DAD0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--warm-white);color:var(--text-dark);line-height:1.9;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  /* nav */
  .b-nav{position:sticky;top:0;z-index:20;background:rgba(251,247,239,.94);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}
  .b-nav .logo img{height:40px;width:auto;display:block;}
  .b-nav .back{font-size:12px;letter-spacing:.06em;color:var(--text-mid);display:inline-flex;align-items:center;gap:6px;transition:color .25s;}
  .b-nav .back:hover{color:var(--moss);}

  /* header */
  .b-head{text-align:center;max-width:680px;margin:0 auto;padding:56px 20px 8px;}
  .b-head .en{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.28em;color:var(--moss);text-transform:uppercase;}
  .b-head h1{font-family:'Noto Serif JP',serif;font-size:clamp(24px,4.4vw,34px);font-weight:600;margin-top:10px;letter-spacing:.02em;}
  .b-head p{font-size:13px;color:var(--text-mid);margin-top:14px;line-height:1.9;}

  /* grid */
  .b-wrap{max-width:1080px;margin:0 auto;padding:40px 20px 64px;}
  .b-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;}
  .b-card{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s;}
  .b-card:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(74,103,65,.14);}
  .b-thumb{aspect-ratio:16/10;overflow:hidden;background:var(--ivory);position:relative;}
  .b-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s;}
  .b-card:hover .b-thumb img{transform:scale(1.05);}
  .b-cat{position:absolute;top:12px;left:12px;font-size:11px;letter-spacing:.06em;font-weight:700;
    color:#fff;background:var(--moss);padding:4px 11px;border-radius:999px;}
  .b-cat.c-sodate{background:var(--moss);}
  .b-cat.c-kazari{background:var(--gold);}
  .b-cat.c-diy{background:var(--brown);}
  .b-cat.c-zakka{background:var(--moss-light);}
  .b-cbody{padding:16px 18px 20px;}
  .b-cbody .date{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.06em;color:var(--gold);font-weight:600;}
  .b-cbody h3{font-family:'Noto Serif JP',serif;font-size:16px;font-weight:600;line-height:1.55;margin:6px 0 8px;color:var(--text-dark);}
  .b-cbody p{font-size:12.5px;color:var(--text-mid);line-height:1.85;}

  /* skeleton */
  .sk-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .sk-thumb{aspect-ratio:16/10;background:linear-gradient(100deg,#efeae0 30%,#f6f2ea 50%,#efeae0 70%);background-size:200% 100%;animation:sk 1.3s infinite;}
  .sk-line{height:12px;margin:14px 18px;border-radius:6px;background:linear-gradient(100deg,#efeae0 30%,#f6f2ea 50%,#efeae0 70%);background-size:200% 100%;animation:sk 1.3s infinite;}
  .sk-line.s{width:40%;}
  @keyframes sk{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  /* empty / error */
  .b-empty{text-align:center;padding:70px 20px;color:var(--text-light);}
  .b-empty .ico{font-size:34px;}
  .b-empty p{margin-top:14px;font-size:14px;letter-spacing:.04em;}

  /* instagram */
  .b-ig{background:var(--moss-pale);text-align:center;padding:56px 24px;}
  .b-ig h2{font-family:'Noto Serif JP',serif;font-size:19px;font-weight:600;letter-spacing:.03em;}
  .b-ig p{font-size:13px;color:var(--text-mid);margin-top:10px;line-height:1.9;}
  .b-ig .ig-btn{display:inline-flex;align-items:center;gap:9px;margin-top:22px;border:1.5px solid var(--moss);
    color:var(--moss);padding:12px 28px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:.04em;transition:all .25s;}
  .b-ig .ig-btn:hover{background:var(--moss);color:#fff;}
  .b-ig .ig-btn svg{width:17px;height:17px;}

  /* footer */
  .b-foot{background:#fff;border-top:1px solid var(--line);text-align:center;padding:50px 24px 40px;}
  .b-foot .line-btn{display:inline-flex;align-items:center;gap:10px;background:#06C755;color:#fff;
    padding:14px 32px;border-radius:999px;font-size:15px;font-weight:700;letter-spacing:.04em;
    box-shadow:0 6px 18px rgba(6,199,85,.28);transition:transform .25s,box-shadow .25s,background .25s;}
  .b-foot .line-btn:hover{background:#05b34c;transform:translateY(-2px);box-shadow:0 10px 24px rgba(6,199,85,.34);}
  .b-foot .line-btn svg{width:21px;height:21px;}
  .b-foot .links{margin-top:24px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--text-mid);}
  .b-foot .links a{transition:color .25s;}
  .b-foot .links a:hover{color:var(--moss);}
  .b-foot .copy{margin-top:26px;font-size:11px;letter-spacing:.08em;color:var(--text-light);}

  @media(max-width:600px){
    .b-grid{grid-template-columns:1fr;gap:18px;}
    .b-head{padding-top:40px;}
  }
</style>
</head>

<script>
  /* ▼▼▼ GAS WebAppのデプロイURLをここに設定してください ▼▼▼ */
  const GAS_API_URL = '【デプロイ後に記入】';

  const CAT_CLASS = { '育て方':'c-sodate', '飾り方':'c-kazari', 'DIY':'c-diy', '雑貨':'c-zakka' };

  function toImgUrl(url){
    if(!url) return '';
    if(url.includes('drive.google.com/uc')) return url;
    const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if(match) return 'https://drive.google.com/uc?export=view&id=' + match[1];
    return url;
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function cardHtml(a){
    const catClass = CAT_CLASS[a.category] || 'c-sodate';
    const catLabel = a.category ? '<span class="b-cat '+catClass+'">'+esc(a.category)+'</span>' : '';
    const img = toImgUrl(a.imageUrl);
    const thumb = img ? '<img src="'+esc(img)+'" alt="'+esc(a.title)+'" loading="lazy">' : '';
    return '<a class="b-card" href="detail.html?id='+encodeURIComponent(a.id)+'">'
      + '<div class="b-thumb">'+thumb+catLabel+'</div>'
      + '<div class="b-cbody"><span class="date">'+esc(a.date)+'</span>'
      + '<h3>'+esc(a.title)+'</h3><p>'+esc(a.excerpt)+'</p></div></a>';
  }

  function renderEmpty(msg){
    document.getElementById('grid').outerHTML =
      '<div class="b-empty"><div class="ico">🌱</div><p>'+esc(msg)+'</p></div>';
  }

  async function loadList(){
    if(!GAS_API_URL || GAS_API_URL.indexOf('http')!==0){
      renderEmpty('記事を準備中です'); return;
    }
    try{
      const res = await fetch(GAS_API_URL + '?action=list', { redirect:'follow' });
      const data = await res.json();
      if(!Array.isArray(data) || data.length===0){ renderEmpty('記事を準備中です'); return; }
      document.getElementById('grid').innerHTML = data.map(cardHtml).join('');
    }catch(err){
      renderEmpty('記事を準備中です');
    }
  }
  loadList();
</script>
