<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --ivory:#EFE8D7;--warm-white:#FBF7EF;--moss:#4A6741;--moss-light:#6B8A61;
    --moss-pale:#EBF0E8;--gold:#D4A629;--brown:#8A6F55;
    --text-dark:#2C2C2C;--text-mid:#5A5A5A;--text-light:#9A9A9A;--line:#E0DAD0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--warm-white);color:var(--text-dark);line-height:1.8;-webkit-font-smoothing:antialiased;padding-bottom:40px;}

  header{background:#fff;border-bottom:1px solid var(--line);padding:18px 18px 16px;position:sticky;top:0;z-index:10;}
  header .en{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.22em;color:var(--moss);text-transform:uppercase;}
  header h1{font-family:'Noto Serif JP',serif;font-size:19px;font-weight:600;margin-top:2px;}
  .summary{display:flex;gap:10px;margin-top:12px;}
  .sum-chip{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 4px;background:var(--warm-white);}
  .sum-chip b{display:block;font-family:'Noto Serif JP',serif;font-size:20px;font-weight:700;line-height:1.2;}
  .sum-chip.pub b{color:var(--moss);} .sum-chip.unpub b{color:var(--brown);}
  .sum-chip span{font-size:11px;color:var(--text-light);letter-spacing:.04em;}

  main{max-width:640px;margin:0 auto;padding:16px 14px 0;}

  .card{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    margin-bottom:12px;cursor:pointer;transition:box-shadow .25s,transform .25s;}
  .card:active{transform:scale(.99);}
  .card:hover{box-shadow:0 8px 22px rgba(74,103,65,.12);}
  .card-thumb{width:96px;min-width:96px;background:var(--ivory);align-self:stretch;}
  .card-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-body{padding:12px 12px 12px 2px;flex:1;min-width:0;}
  .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cat{font-size:10px;font-weight:700;color:#fff;background:var(--moss);padding:2px 9px;border-radius:999px;letter-spacing:.04em;}
  .cat.c-sodate{background:var(--moss);} .cat.c-kazari{background:var(--gold);}
  .cat.c-diy{background:var(--brown);} .cat.c-zakka{background:var(--moss-light);}
  .badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.04em;}
  .badge.on{background:var(--moss-pale);color:var(--moss);}
  .badge.off{background:#F1EADF;color:var(--brown);}
  .card-date{font-family:'Cormorant Garamond',serif;font-size:12px;color:var(--gold);font-weight:600;margin-left:auto;}
  .card h3{font-family:'Noto Serif JP',serif;font-size:14.5px;font-weight:600;line-height:1.5;margin-top:7px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .empty{text-align:center;padding:60px 20px;color:var(--text-light);}
  .loading{text-align:center;padding:70px 20px;color:var(--text-light);}
  .spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--moss);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(44,44,44,.55);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .overlay.show{display:flex;}
  .modal{background:var(--warm-white);width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .3s cubic-bezier(.16,1,.3,1);}
  @keyframes up{from{transform:translateY(40px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .modal-bar{position:sticky;top:0;background:var(--warm-white);padding:10px 0 8px;text-align:center;}
  .modal-bar .grip{width:40px;height:4px;border-radius:999px;background:var(--line);margin:0 auto;}
  .modal-close{position:absolute;right:14px;top:10px;font-size:22px;color:var(--text-light);background:none;border:none;cursor:pointer;line-height:1;}
  .m-inner{padding:6px 20px 24px;}
  .m-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .m-inner h2{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:700;line-height:1.5;margin:12px 0 16px;}
  .m-hero{width:100%;border-radius:10px;display:block;margin-bottom:20px;background:var(--ivory);}
  .m-body{font-size:15px;color:var(--text-mid);line-height:1.95;}
  .m-body h2{font-family:'Noto Serif JP',serif;font-size:18px;color:var(--text-dark);font-weight:600;margin:28px 0 12px;padding-left:12px;border-left:4px solid var(--moss);line-height:1.5;}
  .m-body h3{font-family:'Noto Serif JP',serif;font-size:16px;color:var(--moss);font-weight:600;margin:22px 0 10px;}
  .m-body p{margin:0 0 1.3em;} .m-body ul,.m-body ol{margin:0 0 1.3em 1.3em;} .m-body strong{color:var(--text-dark);}

  .m-actions{position:sticky;bottom:0;background:var(--warm-white);border-top:1px solid var(--line);padding:14px 20px 18px;}
  .btn{display:block;width:100%;text-align:center;padding:15px;border-radius:999px;font-size:16px;font-weight:700;
    letter-spacing:.04em;border:none;cursor:pointer;transition:transform .2s,opacity .2s;}
  .btn:active{transform:scale(.98);}
  .btn-pub{background:var(--moss);color:#fff;}
  .btn-unpub{background:#fff;color:var(--brown);border:1.5px solid var(--brown);}
  .btn[disabled]{opacity:.5;cursor:default;}

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--text-dark);color:#fff;
    padding:12px 22px;border-radius:999px;font-size:13px;letter-spacing:.04em;opacity:0;pointer-events:none;
    transition:opacity .3s,transform .3s;z-index:80;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<header>
  <p class="en">HYGGE Blog Admin</p>
  <h1>HYGGE ブログ管理</h1>
  <div class="summary">
    <div class="sum-chip pub"><b id="sumPub">–</b><span>公開中</span></div>
    <div class="sum-chip unpub"><b id="sumUnpub">–</b><span>未公開</span></div>
  </div>
</header>

<main id="list">
  <div class="loading"><div class="spinner"></div>読み込み中...</div>
</main>

<!-- モーダル -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-bar"><div class="grip"></div><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="m-inner" id="modalInner"></div>
    <div class="m-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const CAT_CLASS = { '育て方':'c-sodate', '飾り方':'c-kazari', 'DIY':'c-diy', '雑貨':'c-zakka' };
  let ARTICLES = [];
  let current = null;

  function toImgUrl(url){
    if(!url) return '';
    if(url.indexOf('drive.google.com/uc')>=0) return url;
    const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if(m) return 'https://drive.google.com/uc?export=view&id=' + m[1];
    return url;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function catClass(c){ return CAT_CLASS[c] || 'c-sodate'; }

  function render(res){
    ARTICLES = res.articles || [];
    document.getElementById('sumPub').textContent   = res.published;
    document.getElementById('sumUnpub').textContent = res.unpublished;

    if(ARTICLES.length === 0){
      document.getElementById('list').innerHTML = '<div class="empty">まだ記事がありません。</div>';
      return;
    }
    document.getElementById('list').innerHTML = ARTICLES.map(function(a){
      const img = toImgUrl(a.imageUrl);
      const thumb = img ? '<img src="'+esc(img)+'" alt="">' : '';
      const cat = a.category ? '<span class="cat '+catClass(a.category)+'">'+esc(a.category)+'</span>' : '';
      const badge = a.published ? '<span class="badge on">公開中</span>' : '<span class="badge off">未公開</span>';
      return '<div class="card" onclick="openModal('+a.id+')">'
        + '<div class="card-thumb">'+thumb+'</div>'
        + '<div class="card-body"><div class="card-meta">'+cat+badge+'<span class="card-date">'+esc(a.date)+'</span></div>'
        + '<h3>'+esc(a.title)+'</h3></div></div>';
    }).join('');
  }

  function load(){
    google.script.run.withSuccessHandler(render).withFailureHandler(function(e){
      document.getElementById('list').innerHTML = '<div class="empty">読み込みに失敗しました。<br>再読み込みしてください。</div>';
    }).getAdminList();
  }

  function openModal(id){
    current = ARTICLES.filter(function(a){ return a.id === id; })[0];
    if(!current) return;
    const a = current;
    const img = toImgUrl(a.imageUrl);
    const hero = img ? '<img class="m-hero" src="'+esc(img)+'" alt="">' : '';
    const cat = a.category ? '<span class="cat '+catClass(a.category)+'">'+esc(a.category)+'</span>' : '';
    const badge = a.published ? '<span class="badge on">公開中</span>' : '<span class="badge off">未公開</span>';
    let bodyHtml = '';
    try { bodyHtml = marked.parse(a.body || ''); } catch(e){ bodyHtml = '<p>'+esc(a.body||'')+'</p>'; }

    document.getElementById('modalInner').innerHTML =
      '<div class="m-meta">'+cat+badge+'<span class="card-date">'+esc(a.date)+'</span></div>'
      + '<h2>'+esc(a.title)+'</h2>' + hero + '<div class="m-body">'+bodyHtml+'</div>';

    renderActions();
    document.getElementById('overlay').classList.add('show');
    document.querySelector('.modal').scrollTop = 0;
  }

  function renderActions(){
    const a = current;
    const html = a.published
      ? '<button class="btn btn-unpub" id="actBtn" onclick="doToggle(false)">非公開に戻す</button>'
      : '<button class="btn btn-pub" id="actBtn" onclick="doToggle(true)">この記事を公開する</button>';
    document.getElementById('modalActions').innerHTML = html;
  }

  function doToggle(flag){
    const btn = document.getElementById('actBtn');
    btn.disabled = true;
    btn.textContent = flag ? '公開中...' : '変更中...';
    google.script.run.withSuccessHandler(function(res){
      render(res);
      current.published = flag;
      renderActions();
      toast(flag ? '公開しました' : '非公開に戻しました');
    }).withFailureHandler(function(e){
      btn.disabled = false;
      renderActions();
      toast('失敗しました。もう一度お試しください');
    }).setPublished(current.id, flag);
  }

  function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
  document.getElementById('overlay').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  load();
</script>
</body>
</html>
